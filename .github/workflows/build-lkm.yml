name: Build SukiSU LKM

on:
  workflow_dispatch:

jobs:
  build-lkm:
    name: Build kernelsu.ko for android16-6.12
    runs-on: ubuntu-latest
    container:
      image: ghcr.io/ylarod/ddk-min:android16-6.12-20260828
      options: --privileged

    steps:
    - name: Checkout source code
      uses: actions/checkout@v6

    - name: Build kernelsu.ko
      run: |
        # 容器本身是 root，不需要 sudo，直接在当前目录操作
        # 删除手动创建和挂载目录的命令
        # mkdir -p /home/runner/work/HuijuiSU/HuijuiSU
        # mount --bind /github/workspace /home/runner/work/HuijuiSU/HuijuiSU

        echo "=== Step 1: 检查当前工作目录 ==="
        pwd
        ls -la
        
        echo "=== Step 2: 检查镜像里的 /opt/ddk ==="
        ls -la /opt/ddk/ 2>&1 || echo "ls /opt/ddk 失败"
        echo "=== Step 3: 检查 /opt/ddk/src ==="
        ls -la /opt/ddk/src/ 2>&1 || echo "ls /opt/ddk/src 失败"
        echo "=== Step 4: 检查目标 KDIR 是否存在 ==="
        ls -la /opt/ddk/src/android16-6.12/ 2>&1 || echo "目标 KDIR 不存在"

        cd kernel
        echo "=== Step 5: 开始编译 ==="
        # 使用 make 命令行参数强制指定 KDIR，避免被 Makefile 覆盖
        CONFIG_KSU=m CC=clang make KDIR=/opt/ddk/src/android16-6.12 2>&1 | head -200

        echo "=== Step 6: 检查产物 ==="
        ls -la kernelsu.ko 2>&1 || echo "kernelsu.ko 未生成"